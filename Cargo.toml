[workspace]
resolver = "3"
members = [
    "crates/ide-core",
    "crates/ide-text",
    "crates/rustidea",
    "crates/rustidea-editor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["RustIdea contributors"]

[workspace.dependencies]
ide-core = { path = "crates/ide-core" }
ide-text = { path = "crates/ide-text" }
rustidea-editor = { path = "crates/rustidea-editor" }

anyhow = "1"
criterion = { version = "0.5", default-features = false }
dirs = "6"
dunce = "1"
encoding_rs = "0.8"
gpui = "=0.2.2"
ignore = "0.4"
proptest = "1"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "2.7", default-features = false }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tempfile = "3"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "debuginfo"
