name: Native Visual Parity

# Two jobs:
#   manifest - cheap contract check (runs anywhere): every captured scenario
#              points at a real PNG with the declared geometry, no two captures
#              are the same image, pending scenarios ship no placeholder.
#   headless-render - renders the GPUI text stack through Metal without a visible
#              window, so glyph painting is verified even while the display is
#              locked (window capture returns stale frames in that state).
#   real-app-screenshots - needs a signed-in macOS GUI session with the pinned
#              OpenIDEA app and the native RustIdea build installed. It is
#              intentionally not run on hosted runners: a headless runner cannot
#              provide the real windows the gate requires.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/visual/**"
      - "tests/visual-baselines/**"
      - "crates/rustidea-design/**"
      - "experiments/zed-poc/crates/workbench/**"
  pull_request:
    paths:
      - "tests/visual/**"
      - "tests/visual-baselines/**"

permissions:
  contents: read

jobs:
  manifest:
    name: Baseline manifest contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate scenarios, files and geometry
        run: python3 tests/visual/validate-manifest.py

  headless-render:
    name: Headless glyph rendering
    needs: manifest
    runs-on: [self-hosted, macOS, rustidea-visual]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Render text without a visible window
        run: |
          cd experiments/zed-poc
          cargo test --release -p rustidea-zed-workbench --test headless_render -- --nocapture

      - name: Build the window probe
        run: PROFILE=release scripts/build-native.sh

      - name: Real window glyph rendering
        run: tests/visual/window-render-smoke.sh

  real-app-screenshots:
    name: Real OpenIDEA vs real RustIdea
    needs: manifest
    runs-on: [self-hosted, macOS, rustidea-visual]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Verify the reference application is installed
        run: |
          test -d "/Applications/OpenIDEA.app" || {
            echo "Install the pinned OpenIDEA build before running this gate." >&2
            exit 1
          }

      - name: Build the native workbench
        run: PROFILE=release scripts/build-native.sh

      - name: Capture and compare the pinned scenarios
        run: tests/visual/run-visual-regression.sh

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-visual-results
          path: |
            tests/visual-results/
            tests/visual-baselines/environment.json
          if-no-files-found: warn
