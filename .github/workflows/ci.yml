name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libclang-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Install plugin WASM target
        run: rustup target add wasm32-wasip2

      - name: Build plugin test fixtures
        shell: bash
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/plugin-fixtures"
          plugins/build.sh --check \
            crates/ide-plugin/tests/fixtures/files-events \
            crates/ide-plugin/tests/fixtures/path-events
          for manifest in crates/ide-plugin/tests/fixtures/*/plugin.toml; do
            dir="$(dirname "$manifest")"
            if [ -f "$dir/Cargo.toml" ] && [ ! -f "$dir/dist/plugin.wasm" ]; then
              echo "missing $dir/dist/plugin.wasm"
              exit 1
            fi
          done

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build application
        run: cargo build --locked --release -p rustidea

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
