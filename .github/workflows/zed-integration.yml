name: Zed Integration

on:
  push:
    branches: [main, integration/zed-workbench, experiment/zed-editor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-system:
    name: Design tokens and workbench model
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install token converter dependency
        run: pip install tinycss2
      - name: Check generated tokens are current
        run: python3 tools/openidea-tokens/generate.py --check
      - name: Test the shared design system and layout model
        run: cargo test --locked -p rustidea-design
      - name: Check formatting
        run: cargo fmt -p rustidea-design -- --check

  native-workbench:
    name: macOS Zed native workbench
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: experiments/zed-poc
          cache-on-failure: true

      - name: Fetch pinned Zed and apply tree-sitter patch
        run: scripts/fetch-zed.sh

      - name: Install native workbench Clippy component
        working-directory: experiments/zed-poc
        run: rustup component add clippy

      - name: Check native workbench
        working-directory: experiments/zed-poc
        run: cargo check --locked -p rustidea-zed-workbench

      - name: Run native workbench tests
        working-directory: experiments/zed-poc
        run: cargo test --locked -p rustidea-zed-workbench

      - name: Run native workbench Clippy
        working-directory: experiments/zed-poc
        run: cargo clippy --locked -p rustidea-zed-workbench --all-targets -- -D warnings
